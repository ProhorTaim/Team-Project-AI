<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Project AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Team Project AI</h1>
        
        <!-- Обёртка с градиентной рамкой -->
        <div class="search-wrapper" id="searchWrapper">
            
            <!-- Поисковая строка -->
            <div class="search-box" id="searchBox">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Опишите свою идею"
                >
                <button id="analyzeBtn" class="analyze-btn"><span>Развить идею</span></button>
            </div>
            
            <!-- Результаты (скрыты по умолчанию) -->
            <div class="results-box" id="resultsBox"></div>
        </div>
        
        <!-- Карточки проектов -->
        <div class="section-label">Проекты из архива университета</div>
        <div class="cards-grid" id="cardsGrid"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
